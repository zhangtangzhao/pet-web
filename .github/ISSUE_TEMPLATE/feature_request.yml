name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 描述业务场景，而非直接描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 如有界面草图 / 竞品参考可一并附上。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 用户端（小程序 / H5）
        - label: 平台管理端
        - label: 后端 API
        - label: 数据库结构
        - label: 部署 / 运维
