name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue 避免重复。
        **安全漏洞请勿在此提交**，见 [SECURITY.md](../../SECURITY.md)。
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 后端 backend（Go / go-zero）
        - 管理端 frontend/apps/admin
        - 移动端 frontend/apps/mobile（小程序 / H5）
        - 数据库 scripts/sql
        - 部署 scripts/deploy（Docker / Nginx）
        - 文档 docs
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入 xxx 页面
        2. 点击 xxx
        3. 出现错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 服务日志片段、接口响应、截图等。注意脱敏（勿贴 JWT、手机号、密钥）。
      render: shell
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        - OS:
        - Go / Node 版本：
        - PostgreSQL / Redis 版本：
        - 部署方式（本地 / docker compose）：
    validations:
      required: true
