Name: pet-api
Host: 0.0.0.0
Port: 8888
Mode: dev # dev/test/。生产使用 pro，此时短信测试公共验证码失效

Auth:
  MemberAccessSecret: member-jwt-secret-change-me
  MemberAccessExpire: 7200 # 2h
  AdminAccessSecret: admin-jwt-secret-change-me
  AdminAccessExpire: 7200 # 2h
RefreshTokenExpireDays: 30

Database:
  DataSource: host=127.0.0.1 port=25432 user=pet password=pet123456 dbname=pet sslmode=disable TimeZone=Asia/Shanghai

Redis:
  Addr: 127.0.0.1:56379
  DB: 0

Snowflake:
  Node: 1

WeChat:
  MiniAppID: ""
  MiniSecret: ""
  H5AppID: ""
  H5Secret: ""

WeChatPay:
  MchID: ""
  MchAPIv3Key: ""
  MchSerialNo: ""
  PrivateKeyPath: ""
  NotifyURL: ""

Sms:
  Provider: "" # aliyun/tencent；空 = 不发真实短信，验证码见服务日志
  TestCode: "888888" # 测试公共验证码，仅 Mode != prod 生效
  CodeExpireSeconds: 300
  SendIntervalSeconds: 60
  DailyLimit: 10

COS:
  Bucket: ""
  Region: ""
  SecretID: ""
  SecretKey: ""
  BaseURL: ""

AI:
  BaseURL: "" # 如 https://api.deepseek.com/v1；三项全配即启用真实大模型
  ApiKey: ""
  Model: "" # 如 deepseek-chat
  AskIntervalSeconds: 5
  DailyLimit: 20
  RecommendIntervalSeconds: 10 # 智能选宠 LLM 推荐最小间隔（未配置大模型时规则打分不频控）
  RecommendDailyLimit: 5

Notify:
  MiniTmplCsReply: ""
  MiniTmplOrder: ""
  MiniTmplCoupon: ""
  H5TmplCsReply: ""
  H5TmplOrder: ""
  H5TmplCoupon: ""

Trade:
  AutoConfirmDays: 7 # 已支付订单 N 天后自动确认完成；≤0 关闭

Log:
  ServiceName: pet-api
  Level: info
