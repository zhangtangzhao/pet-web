# scripts/deploy/nginx.conf
# 容器内挂载为 /etc/nginx/conf.d/default.conf
# 职责：用户端 H5 / 平台管理端静态托管 + API 反向代理

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 代理通用配置（server 级，作用于所有 proxy location）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 20m;

    # ── 平台端 API（前缀更长，优先于 /admin 静态匹配）──
    location /admin/api/ {
        proxy_pass http://api:8888;
    }

    # ── 客服 WebSocket（升级连接 + 超长读超时；置于 /api/ 之前，长前缀优先）──
    location /api/ws/ {
        proxy_pass http://api:8888;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 用户端 API（含微信支付回调 /api/pay/notify/wx）──
    location /api/ {
        proxy_pass http://api:8888;
    }

    # ── 平台管理端静态资源（Vite 产物，构建时需设置 base=/admin/）──
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── 用户端 H5（Taro 产物，BrowserRouter）──
    location / {
        root /usr/share/nginx/html/h5;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
