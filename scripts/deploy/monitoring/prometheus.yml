# scripts/deploy/monitoring/prometheus.yml
# Prometheus 抓取配置：容器网络内直连 pet-api /metrics
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8888"]
